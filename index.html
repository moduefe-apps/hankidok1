<!DOCTYPE html>
<html lang="ko">
<head>

<style>
:root{
  /* 표지 색: 하늘 바탕 · 남색 글자 · 하늘색 '한' · 새싹 초록 */
  --paper:#E9F6FE;
  --card:#FFFFFF;
  --ink:#093260;
  --soft:#4F6F8F;
  --line:#C9E3F3;
  --sky:#60C7F2;
  --go:#0F8FD0;
  --go-dk:#0B6FA3;
  --go-dkr:#08577F;
  --again:#05977A;
  --again-txt:#047A63;
  --focus:#093260;
  --bead:#D3EAF7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",Pretendard,"Malgun Gothic",system-ui,sans-serif;
  line-height:1.6;-webkit-text-size-adjust:100%;
}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--focus);outline-offset:3px}

/* ─── 학생 화면 ─────────────────────── */
.screen{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding:14px 18px 20px;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:40px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.titles{display:flex;flex-direction:column;gap:1px;min-width:0}
.titles strong{font-size:15px;font-weight:600;color:var(--ink);letter-spacing:-.01em;line-height:1.35;word-break:keep-all}
.titles strong b{font-weight:800;color:var(--go)}
.vol{display:inline-block;margin-left:4px;padding:1px 8px;border-radius:99px;background:var(--ink);color:#fff;
  font-size:12.5px;font-weight:800;vertical-align:1px}
.count{font-size:13px;font-weight:700;color:var(--soft);letter-spacing:.02em}
.gear{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--soft)}
.gear:hover{background:#D6EDFA}
.gear svg{width:21px;height:21px;display:block}

.main{flex:1;display:flex;flex-direction:column;justify-content:center;gap:22px;padding:8px 0}

.numchip{
  align-self:center;background:var(--card);border:1.5px solid var(--sky);
  border-radius:999px;padding:7px 16px 7px 20px;font-size:15px;font-weight:800;letter-spacing:.04em;
  display:inline-flex;align-items:center;gap:7px;
}
.numchip svg{width:13px;height:13px;color:var(--soft)}
.numchip:active{background:#EEF8FE}

/* 번호 고르기 */
.picker{display:grid;grid-template-columns:repeat(auto-fill,minmax(46px,1fr));gap:7px}
.picker button{
  height:46px;border:1px solid var(--line);background:#F7FCFF;border-radius:10px;
  font-size:16px;font-weight:700;color:var(--ink);
}
.picker button.done{background:var(--go);color:#fff;border-color:transparent}
.picker button[aria-current=true]{outline:3px solid var(--ink);outline-offset:2px}
.pickwrap{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}

.slate{
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  min-height:132px;display:grid;place-items:center;padding:24px 18px;text-align:center;
}
.slate p{margin:0;font-size:27px;font-weight:600;line-height:1.55;letter-spacing:.01em;word-break:keep-all}
.slate.blank p{font-size:15px;font-weight:500;color:var(--soft);letter-spacing:0}

/* 듣기 버튼 */
.listen{
  align-self:center;width:150px;height:150px;border-radius:50%;
  background:var(--go);color:#fff;display:grid;place-items:center;gap:0;
  box-shadow:0 6px 0 var(--go-dk);
}
.listen:active{transform:translateY(3px);box-shadow:0 3px 0 var(--go-dk)}
.listen span{font-size:22px;font-weight:800;letter-spacing:.08em}
.listen[data-state=playing]{background:var(--go-dk);box-shadow:0 6px 0 var(--go-dkr)}

.wave{display:flex;align-items:center;justify-content:center;gap:5px;height:34px;margin-bottom:6px}
.wave i{width:6px;height:10px;border-radius:3px;background:rgba(255,255,255,.55);display:block}
.listen[data-state=playing] .wave i{background:#fff;animation:bounce .9s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.12s}
.wave i:nth-child(3){animation-delay:.24s}
.wave i:nth-child(4){animation-delay:.36s}
.wave i:nth-child(5){animation-delay:.48s}
@keyframes bounce{0%,100%{height:10px}50%{height:30px}}
@media (prefers-reduced-motion:reduce){
  .wave i{animation:none!important}
  .listen[data-state=playing] .wave i{height:24px}
}

/* 대기(받아쓸 시간) 표시 */
.waiting{text-align:center;font-size:15px;font-weight:700;color:var(--again-txt);min-height:22px}
.waiting.hide{visibility:hidden}

.pair{display:flex;gap:10px}
.pair button{
  flex:1;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:16px 8px;font-size:17px;font-weight:700;
}
.pair button:disabled{opacity:.35}
#again{background:var(--again);color:#fff;border-color:transparent}
#again:disabled{background:var(--card);color:var(--ink);border-color:var(--line)}


/* 진행 구슬 (오늘 할 문장이 20개 이하일 때) */
.beads{display:flex;flex-wrap:wrap;gap:7px;justify-content:center;padding-top:18px}
.beads button{
  width:30px;height:30px;border-radius:50%;background:var(--bead);
  font-size:12px;font-weight:700;color:var(--soft);
}
.beads button.done{background:var(--go);color:#fff}
.beads button[aria-current=true]{outline:3px solid var(--ink);outline-offset:2px}

/* 진행 막대 (문장이 많을 때) */
.track{height:9px;border-radius:99px;background:var(--bead);margin-top:20px;overflow:hidden}
.fill{height:100%;background:var(--go);border-radius:99px;width:0;transition:width .25s ease}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

/* 다 했어요 */
.finish{text-align:center;padding:8px 0 0}
.finish strong{display:block;font-size:22px;font-weight:800;margin-bottom:4px}
.finish span{font-size:14px;color:var(--soft)}

/* ─── 교사 설정 ─────────────────────── */
.sheet{position:fixed;top:0;right:0;bottom:0;left:0;background:rgba(9,50,96,.45);display:none;z-index:20;
  align-items:flex-end;justify-content:center}
.sheet[open]{display:flex}
.panel{background:var(--paper);width:100%;max-width:520px;max-height:90vh;max-height:90svh;overflow:auto;-webkit-overflow-scrolling:touch;
  padding-bottom:calc(28px + env(safe-area-inset-bottom,0px));
  border-radius:18px 18px 0 0;padding:18px 18px 28px}
.panel header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.panel h2{font-size:17px;font-weight:800;margin:0}
.panel .note{font-size:12.5px;color:var(--soft);margin:0 0 16px}
.close{font-size:15px;font-weight:700;color:var(--soft);padding:8px 4px}

.set{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.set > label{display:block;font-size:13.5px;font-weight:700;margin-bottom:9px}
.set .sub{font-size:12px;color:var(--soft);margin:8px 0 0}

.opts{display:flex;flex-wrap:wrap;gap:7px}
.opts button{border:1px solid var(--line);background:#F7FCFF;border-radius:9px;
  padding:9px 13px;font-size:13.5px;font-weight:600;color:var(--soft)}
.opts button[aria-pressed=true]{background:var(--ink);color:#fff;border-color:transparent}

.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stepper button{width:44px;padding:9px 0;font-size:19px;font-weight:700;background:#F7FCFF}
.stepper output{min-width:66px;text-align:center;font-size:14px;font-weight:700;padding:9px 4px;
  border-left:1px solid var(--line);border-right:1px solid var(--line)}

.range{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.range span{white-space:nowrap}
.range input{width:68px;font:inherit;font-size:16px;font-weight:600;text-align:center;
  border:1px solid var(--line);border-radius:9px;padding:9px 4px;background:#F7FCFF;color:var(--ink)}

.linkbtn{width:100%;background:var(--ink);color:#fff;border-radius:11px;padding:15px;
  font-size:15px;font-weight:700;margin-top:4px}
.linkout{white-space:pre-line;font-size:12px;color:var(--soft);word-break:break-all;margin:9px 0 0;min-height:16px}
</style>
</head>
<body>

<div class="screen">
  <div class="bar">
    <div class="titles">
      <strong><b>한</b> 문장씩 <b>키</b>워가는 <b>독</b>해력<span class="vol">1권</span></strong>
      <span class="count" id="count">1 / 100</span>
    </div>
    <button class="gear" id="openSet" aria-label="선생님 설정">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="3.1"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.11a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.11A1.7 1.7 0 0 0 4.67 8.6a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.24h.08A1.7 1.7 0 0 0 10.11 2.7V3a2 2 0 1 1 4 0v.11a1.7 1.7 0 0 0 1.03 1.56 1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87V9c.2.63.79 1.06 1.45 1.06H21a2 2 0 1 1 0 4h-.11a1.7 1.7 0 0 0-1.49 1.03z"/>
      </svg>
    </button>
  </div>

  <div class="main">
    <button class="numchip" id="numchip">
      <span id="numchipText">1번</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
    </button>
    <div class="slate blank" id="slate"><p id="slateText"></p></div>

    <button class="listen" id="listen" data-state="idle">
      <div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <span id="listenLabel">듣기</span>
    </button>

    <p class="waiting hide" id="waiting"></p>

    <div class="pair">
      <button id="again" disabled>다시</button>
      <button id="reveal" disabled>확인</button>
    </div>
  </div>

  <div class="beads" id="beads"></div>
  <div class="track" id="track" hidden><div class="fill" id="fill"></div></div>
</div>

<div class="sheet" id="pickSheet" role="dialog" aria-modal="true" aria-label="문장 고르기">
  <div class="panel">
    <header>
      <h2>문장 고르기</h2>
      <button class="close" id="closePick">닫기</button>
    </header>
    <p class="note">번호를 누르면 그 문장으로 갑니다. 파란색은 이미 들은 문장입니다.</p>
    <div class="pickwrap"><div class="picker" id="picker"></div></div>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="선생님 설정">
  <div class="panel">
    <header>
      <h2>선생님 설정</h2>
      <button class="close" id="closeSet">닫기</button>
    </header>
    <p class="note">학생에게 주기 전에 미리 맞춰두세요. 학생 화면에는 이 설정이 보이지 않습니다.</p>

    <div class="set">
      <label>오늘 할 문장</label>
      <div class="range">
        <input type="number" id="from" min="1" value="1" aria-label="시작 번호">
        <span>번부터</span>
        <input type="number" id="to" min="1" value="10" aria-label="끝 번호">
        <span>번까지</span>
      </div>
      <p class="sub">범위 밖 문장은 학생 화면에 나오지 않습니다.</p>
    </div>

    <div class="set">
      <label>읽는 속도</label>
      <div class="opts" id="optSpeed">
        <button data-v="0.8">느리게</button>
        <button data-v="1" aria-pressed="true">보통</button>
        <button data-v="1.15">빠르게</button>
      </div>
    </div>

    <div class="set">
      <label>한 번 누르면 몇 번 들려줄까요</label>
      <div class="stepper"><button data-t="reps" data-d="-1" aria-label="줄이기">−</button><output id="repsOut">2번</output><button data-t="reps" data-d="1" aria-label="늘리기">+</button></div>
    </div>

    <div class="set">
      <label>받아쓸 시간</label>
      <div class="opts" id="optWait">
        <button data-v="manual" aria-pressed="true">학생이 누를 때까지</button>
        <button data-v="timer">시간 정하기</button>
      </div>
      <div id="waitTimer" hidden style="margin-top:10px">
        <div class="stepper"><button data-t="wait" data-d="-5" aria-label="줄이기">−</button><output id="waitOut">20초</output><button data-t="wait" data-d="5" aria-label="늘리기">+</button></div>
        <p class="sub">한 글자에 2~3초가 걸립니다. 10글자면 25초 안팎이 필요합니다.</p>
      </div>
    </div>

    <div class="set">
      <label>다 쓰면 다음 문장으로</label>
      <div class="opts" id="optAuto">
        <button data-v="0" aria-pressed="true">학생이 &lsquo;다음&rsquo; 누르기</button>
        <button data-v="1">저절로 넘어가기</button>
      </div>
    </div>

    <button class="linkbtn" id="makeLink">이 설정 링크 복사</button>
    <p class="linkout" id="linkOut">설정을 담은 주소가 만들어집니다. 즐겨찾기에 넣거나 학생에게 보내세요.</p>
  </div>
</div>

  /*  70 */ "다람쥐가 숲에서 도토리를 찾아요.",
  /*  71 */ "세현이가 휴지통에 쓰레기를 버려요.",
  /*  72 */ "진우가 바닷가에서 조개를 주워요.",
  /*  73 */ "채린이가 도서관에서 책을 빌려요.",
  /*  74 */ "아빠가 밭에서 잡초를 뽑아요.",
  /*  75 */ "아빠는 방금 전화를 받았다.",
  /*  76 */ "다인이가 저녁에 그림을 그렸다.",
  /*  77 */ "도현이는 어제 피아노를 쳤다.",
  /*  78 */ "하늘이는 주말에 영화를 봤다.",
  /*  79 */ "영우는 낮에 책을 읽었다.",
  /*  80 */ "유림이는 여름방학에 춤을 배웠다.",
  /*  81 */ "강현이는 아침에 머리를 감아요.",
  /*  82 */ "고양이가 밤에 쥐를 잡아요.",
  /*  83 */ "은호가 겨울에 장갑을 껴요.",
  /*  84 */ "지안이는 월요일에 수학을 배워요.",
  /*  85 */ "지혁이가 쉬는 시간에 블록을 쌓아요.",
  /*  86 */ "혜린이가 점심에 줄넘기를 넘어요.",
  /*  87 */ "태민이가 맛있는 사과를 깎는다.",
  /*  88 */ "연우가 오래된 낙서를 지운다.",
  /*  89 */ "우영이가 파란 모자를 벗는다.",
  /*  90 */ "할아버지는 낡은 자전거를 탄다.",
  /*  91 */ "아저씨가 무거운 상자를 든다.",
  /*  92 */ "은채는 하얀 강아지를 키운다.",
  /*  93 */ "채민이는 어려운 문제를 푼다.",
  /*  94 */ "아빠가 맛있는 반찬을 만들어요.",
  /*  95 */ "하진이가 빨간 리본을 묶어요.",
  /*  96 */ "지혜가 큰 상자를 옮겨요.",
  /*  97 */ "주호가 고장 난 장난감을 고쳐요.",
  /*  98 */ "서율이가 뜨거운 코코아를 식혀요.",
  /*  99 */ "다람쥐가 작은 도토리를 모아요.",
  /* 100 */ "새는 동그란 알을 낳아요.",
];   // ← 따옴표 안에 문장을 넣으세요
const EMBEDDED  = {};               // 내장 음원 (배포판은 비워 둠 — 음원은 audio 폴더에)
const AUDIO_DIR = "audio/";         // audio/001.mp3, audio/002.mp3 … (세 자리 번호)
const VERSION   = "2";             // 음성을 새로 올릴 때마다 숫자를 1씩 올리세요
const TOTAL     = 100;              // 문장 번호 1~100

function audioUrl(n){ return AUDIO_DIR ? AUDIO_DIR + String(n).padStart(3,"0") + ".mp3" + (VERSION ? "?v="+VERSION : "") : null; }

/* ── 설정 ── */
const S = { from:1, to:100, speed:1, reps:2, wait:"manual", waitSec:20, auto:0 };

const AVAILABLE = Object.keys(EMBEDDED).map(Number).sort((a,b)=>a-b);
const MAXNUM = TOTAL;

/* 주소에 담긴 설정 읽기 */
(function readUrl(){
  const q = new URLSearchParams(location.search);
  const num = (k,d)=>{const v=+q.get(k);return Number.isFinite(v)&&q.get(k)!==null?v:d;};
  S.from=Math.max(1,num("f",S.from)); S.to=Math.min(MAXNUM,num("t",S.to));
  if(S.to<S.from) S.to=S.from;
  const sp=+q.get("r"); if([0.8,1,1.15].includes(sp)) S.speed=sp;
  S.reps=Math.max(1,Math.min(4,num("n",S.reps)));
  if(q.get("w")==="timer"){S.wait="timer";}
  S.waitSec=Math.max(5,Math.min(60,num("d",S.waitSec)));
  S.auto=num("a",S.auto)?1:0;
})();

/* ── 소리 ──
   <audio> 하나로 재생합니다.
   · 아이폰 무음(진동) 모드에서도 소리가 납니다.
   · 느리게/빠르게로 바꿔도 목소리 높낮이가 그대로입니다.
   · 카카오톡·네이버 앱 안의 브라우저에서도 동작합니다. */
const $=id=>document.getElementById(id);
const player=document.createElement("audio");
player.preload="auto";
player.setAttribute("playsinline",""); player.setAttribute("webkit-playsinline","");
document.body.appendChild(player);
try{ if(navigator.audioSession) navigator.audioSession.type="playback"; }catch(e){}
let current=0;          // player에 들어 있는 문장 번호

function srcFor(n){ return EMBEDDED[n] || audioUrl(n); }
function setRate(){
  try{
    player.defaultPlaybackRate=S.speed; player.playbackRate=S.speed;
    player.preservesPitch=true; player.webkitPreservesPitch=true; player.mozPreservesPitch=true;
  }catch(e){}
}
player.addEventListener("loadedmetadata",setRate);
player.addEventListener("play",setRate);

function silence(){
  player.onended=player.onerror=player.onplaying=null;
  try{ player.pause(); }catch(e){}
}
/* 한 번 재생. 처음 한 번은 반드시 버튼을 누른 순간에 바로 불려야 합니다(아이폰 규칙). */
function once(n,onPlaying){
  return new Promise((ok,no)=>{
    const src=srcFor(n);
    if(!src){ no(new Error("음원이 없습니다")); return; }
    player.onended=()=>{ player.onended=null; ok(); };
    player.onerror=()=>{ current=0;
      no(new Error(navigator.onLine===false ? "인터넷 연결을 확인해 주세요" : "소리를 불러오지 못했습니다. 다시 눌러 주세요")); };
    player.onplaying=onPlaying||null;
    if(current!==n){ player.src=src; current=n; }
    else { try{ player.currentTime=0; }catch(e){} }
    setRate();
    let p;
    try{ p=player.play(); }catch(e){ no(new Error("소리를 재생할 수 없습니다")); return; }
    if(p && p.catch) p.catch(e=>{
      if(e && e.name==="AbortError") return;           // 멈춤 버튼 등으로 끊긴 경우
      if(e && e.name==="NotSupportedError"){ current=0; no(new Error("소리를 불러오지 못했습니다. 다시 눌러 주세요")); return; }
      no(new Error("듣기를 한 번 더 눌러 주세요"));
    });
  });
}
/* 다음 문장 음원을 미리 받아 두기 */
function warm(n){
  if(!n) return;
  const u=!EMBEDDED[n] && audioUrl(n);
  if(u && window.fetch && location.protocol!=="file:") fetch(u).catch(()=>{});
}

/* ── 화면 ── */
let list=[], idx=0, done=new Set(), session=0, timer=null;

function buildList(){
  list=[];
  for(let n=S.from;n<=S.to;n++) list.push(n);
  if(!list.length) list=[1];
  idx=Math.min(idx,list.length-1);
}

function buildPicker(){
  const el=$("picker"); el.innerHTML="";
  list.forEach((n,i)=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=n;
    b.setAttribute("aria-label",n+"번 문장");
    b.addEventListener("click",()=>{ closePick(); go(i); });
    el.appendChild(b);
  });
}
function paintPicker(){
  [...$("picker").children].forEach((b,i)=>{
    b.classList.toggle("done",done.has(list[i]));
    b.setAttribute("aria-current",i===idx);
  });
}
function openPick(){ session++; silence(); paintPicker(); $("pickSheet").setAttribute("open",""); }
function closePick(){ $("pickSheet").removeAttribute("open"); }

/* 문장이 20개 이하면 아래 구슬, 많으면 진행 막대 (번호는 위 버튼으로 고르기) */
function buildBeads(){
  const el=$("beads"); el.innerHTML="";
  const many = list.length>20;
  el.hidden=many; $("track").hidden=!many;
  if(many) return;
  list.forEach((n,i)=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=n;
    b.setAttribute("aria-label",n+"번 문장");
    b.addEventListener("click",()=>{go(i)});
    el.appendChild(b);
  });
}

function paint(){
  const n=list[idx];
  $("count").textContent=(idx+1)+" / "+list.length;
  $("numchipText").textContent=n+"번";
  [...$("beads").children].forEach((b,i)=>{
    b.classList.toggle("done",done.has(list[i]));
    b.setAttribute("aria-current",i===idx);
  });
  $("fill").style.width = Math.round(done.size/list.length*100)+"%";
  paintPicker();
  showText(false);
}

function showText(on){
  const t=SENTENCES[list[idx]-1];
  const slate=$("slate"), p=$("slateText");
  if(on && t){ slate.classList.remove("blank"); p.textContent=t; }
  else if(on && !t){ slate.classList.add("blank"); p.textContent="문장이 등록되지 않았습니다"; }
  else { slate.classList.add("blank"); p.textContent=""; }
}

function setWaiting(text){
  const w=$("waiting");
  if(text){ w.textContent=text; w.classList.remove("hide"); }
  else { w.classList.add("hide"); }
}

function go(i){
  session++; silence(); clearInterval(timer);
  idx=Math.max(0,Math.min(list.length-1,i));
  $("listen").dataset.state="idle"; $("listenLabel").textContent="듣기";
  $("again").disabled=true;
  const r=$("reveal"); r.disabled=true; r.dataset.mode=""; r.textContent="확인";
  setWaiting("");
  paint();
}

async function playAll(){
  const my=++session;
  const n=list[idx];
  const btn=$("listen");
  clearInterval(timer);
  btn.dataset.state="loading"; $("listenLabel").textContent="…";
  const playing=()=>{ if(my===session){ btn.dataset.state="playing"; $("listenLabel").textContent="듣는 중"; } };

  for(let r=1;r<=S.reps;r++){
    if(my!==session) return;
    setWaiting(S.reps>1 ? r+" / "+S.reps : "");
    try{ await once(n,playing); }          // 첫 번째는 누른 순간 바로 시작됨
    catch(e){
      if(my!==session) return;
      btn.dataset.state="idle"; $("listenLabel").textContent="듣기";
      setWaiting(e.message||"소리를 불러올 수 없습니다"); return;
    }
    if(my!==session) return;
    if(r<S.reps){ btn.dataset.state="playing"; await new Promise(k=>setTimeout(k,700)); }
  }
  btn.dataset.state="idle"; $("listenLabel").textContent="다시 듣기";
  $("again").disabled=false;
  done.add(n); paint();
  $("reveal").disabled=false;
  if(S.wait==="timer") countdown(my);
  else setWaiting("다 쓰면 확인을 누르세요");
  warm(list[idx+1]);
}

function countdown(my){
  let left=S.waitSec;
  setWaiting("받아쓸 시간 "+left+"초");
  clearInterval(timer);
  timer=setInterval(()=>{
    if(my!==session){clearInterval(timer);return;}
    left--;
    if(left<=0){ clearInterval(timer); revealNow(); }
    else setWaiting("받아쓸 시간 "+left+"초");
  },1000);
}

$("listen").addEventListener("click",()=>{
  if($("listen").dataset.state==="playing"){ session++; silence();
    $("listen").dataset.state="idle"; $("listenLabel").textContent="다시 듣기"; setWaiting(""); return; }
  playAll();
});
$("again").addEventListener("click",playAll);

function revealNow(){
  showText(true);
  setWaiting(idx<list.length-1 ? "맞게 썼는지 살펴보세요" : "다 했어요");
  const r=$("reveal");
  r.disabled=false; r.dataset.mode="next";
  r.textContent = idx<list.length-1 ? "다음 문장" : "끝";
  if(S.auto && idx<list.length-1) setTimeout(()=>{ if(idx<list.length-1) go(idx+1); },2500);
}
$("reveal").addEventListener("click",()=>{
  if($("reveal").dataset.mode==="next"){ if(idx<list.length-1) go(idx+1); return; }
  revealNow();
});

/* ── 설정 화면 ── */
$("numchip").addEventListener("click",openPick);
$("closePick").addEventListener("click",closePick);
$("pickSheet").addEventListener("click",e=>{ if(e.target===$("pickSheet")) closePick(); });

$("openSet").addEventListener("click",()=>{ session++; silence(); syncPanel(); $("sheet").setAttribute("open",""); });
$("closeSet").addEventListener("click",closePanel);
$("sheet").addEventListener("click",e=>{ if(e.target===$("sheet")) closePanel(); });
document.addEventListener("keydown",e=>{ if(e.key!=="Escape")return; if($("sheet").hasAttribute("open")) closePanel(); else if($("pickSheet").hasAttribute("open")) closePick(); });

function closePanel(){
  $("sheet").removeAttribute("open");
  buildList(); buildBeads(); buildPicker(); go(0);
}

function group(id,key,cast){
  $(id).addEventListener("click",e=>{
    const b=e.target.closest("button"); if(!b)return;
    [...$(id).children].forEach(c=>c.setAttribute("aria-pressed",c===b));
    S[key]=cast?cast(b.dataset.v):b.dataset.v;
    if(key==="wait") $("waitTimer").hidden = S.wait!=="timer";
  });
}
group("optSpeed","speed",Number);
group("optWait","wait");
group("optAuto","auto",Number);

document.querySelectorAll(".stepper button").forEach(b=>b.addEventListener("click",()=>{
  const d=+b.dataset.d;
  if(b.dataset.t==="reps"){ S.reps=Math.max(1,Math.min(4,S.reps+d)); $("repsOut").textContent=S.reps+"번"; }
  else { S.waitSec=Math.max(5,Math.min(60,S.waitSec+d)); $("waitOut").textContent=S.waitSec+"초"; }
}));

$("from").addEventListener("change",e=>{
  S.from=Math.max(1,Math.min(MAXNUM,+e.target.value||1));
  if(S.to<S.from){S.to=S.from;$("to").value=S.to;}
  e.target.value=S.from;
});
$("to").addEventListener("change",e=>{
  S.to=Math.max(S.from,Math.min(MAXNUM,+e.target.value||S.from));
  e.target.value=S.to;
});

function syncPanel(){
  $("from").value=S.from; $("from").max=MAXNUM;
  $("to").value=S.to;     $("to").max=MAXNUM;
  const mark=(id,v)=>[...$(id).children].forEach(c=>c.setAttribute("aria-pressed",c.dataset.v===String(v)));
  mark("optSpeed",S.speed); mark("optWait",S.wait); mark("optAuto",S.auto);
  $("waitTimer").hidden = S.wait!=="timer";
  $("repsOut").textContent=S.reps+"번";
  $("waitOut").textContent=S.waitSec+"초";
}

$("makeLink").addEventListener("click",async()=>{
  const q=new URLSearchParams({f:S.from,t:S.to,r:S.speed,n:S.reps,w:S.wait,d:S.waitSec,a:S.auto});
  const url=location.origin+location.pathname+"?"+q;
  let msg="주소를 복사했습니다. 즐겨찾기에 넣어두세요.";
  let ok=false;
  try{ if(navigator.clipboard && window.isSecureContext){ await navigator.clipboard.writeText(url); ok=true; } }catch(e){}
  if(!ok){
    try{ const ta=document.createElement("textarea"); ta.value=url; ta.setAttribute("readonly","");
      ta.style.cssText="position:fixed;top:0;left:0;opacity:0"; document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0,url.length); ok=document.execCommand("copy"); ta.remove(); }catch(e){}
  }
  if(!ok) msg="아래 주소를 길게 눌러 복사하세요.";
  $("linkOut").textContent=msg+"\n"+url;
});

/* 다른 앱으로 넘어가면 소리 멈추기 */
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden) return;
  if($("listen").dataset.state!=="idle"){
    session++; silence();
    $("listen").dataset.state="idle"; $("listenLabel").textContent="듣기"; setWaiting("");
  }
});

/* 시작 */
buildList(); buildBeads(); buildPicker(); syncPanel(); go(0); warm(list[0]);
</script>
</body>
</html>
